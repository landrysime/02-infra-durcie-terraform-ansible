# Inventaire — 2 zones : DMZ (bastion) et interne
# Remplace les IP par celles de tes 2 VM Debian Hyper-V.

[dmz]
bastion ansible_host=192.168.100.10

[interne]
interne ansible_host=192.168.100.20

[all:vars]
ansible_user=styve
ansible_python_interpreter=/usr/bin/python3
# Authentification : clé SSH (recommandé) OU mot de passe.
# Clé   : ansible_ssh_private_key_file=~/.ssh/id_rsa
# Mot de passe : lance avec   ansible-playbook site.yml --ask-pass --ask-become-pass
