---
# ============================================================
# Role audit-logging — auditd + journald (CIS section 4)
# ============================================================

- name: "CIS 4.1.1 - Installer auditd"
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    update_cache: true

- name: "CIS 4.1.2 - Activer auditd au demarrage"
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started

- name: "CIS 4.1.3-4.1.16 - Deployer les regles d'audit CIS"
  ansible.builtin.copy:
    src: cis.rules
    dest: /etc/audit/rules.d/cis.rules
    owner: root
    group: root
    mode: "0640"
  notify: restart auditd

# ---------- Journalisation persistante (CIS 4.2.1.x) ----------
- name: "CIS 4.2.1.x - Rendre les journaux systemd persistants"
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?\s*Storage='
    line: "Storage=persistent"
  notify: restart journald

- name: "CIS 4.2.1.x - Compresser les journaux volumineux"
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?\s*Compress='
    line: "Compress=yes"
  notify: restart journald
